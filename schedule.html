<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 UNITED POWER Alliance | Spawn Timers</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --gold: #d4af37;
            --boss: #ef4444;
            --siege: #3b82f6;
            --clanhall: #22c55e;
            --bg-dark: #12151b;
            --panel-bg: rgba(20, 24, 32, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        body {
            background: #0a0c0f;
            background-image: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), url('images/baium.png');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: #eee;
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 0;
        }
        
        .top-header { text-align: center; padding-top: 20px; }
        .ally-logo { width: 110px; filter: drop-shadow(0 0 15px var(--gold)); }
        .ally-title { font-family: 'Cinzel Decorative', cursive; font-size: 1.8rem; color: var(--gold); display: block; letter-spacing: 2px; margin-bottom: 20px; }
        .main-nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .nav-btn { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); color: var(--gold); padding: 8px 15px; font-family: 'Cinzel'; cursor: pointer; transition: 0.3s; font-size: 0.75rem; border-radius: 4px; text-decoration: none; }
        .nav-btn:hover, .nav-btn.active { background: var(--gold); color: #000; }

        .page-wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px 60px; }
        .tz-note { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 30px; font-family: 'Cinzel'; }
        .tz-note span { color: var(--gold); }

        /* SPLIT UI CONTAINER */
        .ui-container {
            display: flex;
            gap: 40px;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
        }

        /* LEFT PANEL: CHRONOS TIME */
        .left-panel {
            flex: 0 0 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 2px solid rgba(255,255,255,0.05);
            padding-right: 40px;
        }
        .left-panel h2 {
            font-family: 'Cinzel', serif;
            color: #dcdcdc;
            font-size: 1.8rem;
            margin: 0 0 20px;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,1);
        }
        .left-panel h2 span { color: var(--gold); font-size: 1.2rem; }
        
        .hourglass-img {
            width: 280px;
            height: 280px;
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(60, 100, 255, 0.5));
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .main-timer {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            color: #ffdda1;
            text-shadow: 0 0 20px rgba(255, 200, 100, 0.6), 0 0 10px rgba(0,0,0,1);
            margin: 20px 0 5px;
            letter-spacing: 2px;
            white-space: nowrap;
        }
        .main-timer.spawned { color: #ef4444; }
        .chronos-label {
            font-family: 'Open Sans', sans-serif;
            color: #888;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* RIGHT PANEL: TABS & GRID */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        /* TABS */
        .ui-tabs {
            display: flex;
            gap: 2px;
            background: rgba(0,0,0,0.5);
            padding: 4px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        .ui-tab {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            background: rgba(30, 35, 45, 0.6);
            color: #777;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-top: 1px solid transparent;
        }
        .ui-tab:hover {
            color: #ccc;
            background: rgba(50, 60, 75, 0.8);
        }
        .ui-tab.active {
            background: rgba(40, 50, 70, 0.9);
            color: #ffdda1;
            border-top: 2px solid var(--gold);
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5);
        }

        /* EVENTS GRID */
        .events-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: flex-start;
            align-content: flex-start;
            flex: 1;
        }
        .event-token {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 140px;
            position: relative;
        }
        .event-token .icon-frame {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(0,0,0,0.8);
            border: 2px solid rgba(150, 150, 150, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }
        .event-token:hover .icon-frame {
            border-color: var(--gold);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        .event-token .icon-frame img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }
        
        .event-timer {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: #ffdda1;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px #000;
        }
        .event-timer.spawned { color: #ef4444; font-size: 1.1rem; }
        
        .event-name {
            font-family: 'Open Sans', sans-serif;
            font-size: 0.85rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.3;
        }
        .event-date {
            font-size: 0.75rem;
            color: #666;
            margin-top: 4px;
        }

        .category-header {
            width: 100%;
            font-family: 'Cinzel', serif;
            color: #888;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
            margin-bottom: 20px;
            margin-top: 10px;
        }
        
        .updated-note { text-align: center; color: #666; font-size: 0.75rem; font-family: 'Cinzel'; margin-top: 20px; }
        .loading-text { text-align: center; font-family: 'Cinzel'; color: var(--gold); font-size: 1.3rem; padding: 60px 0; width: 100%; }

        @media (max-width: 1100px) {
            .ui-container { flex-direction: column; }
            .left-panel { border-right: none; border-bottom: 2px solid rgba(255,255,255,0.05); padding-right: 0; padding-bottom: 30px; margin-bottom: 30px; }
            .events-grid { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="top-header">
        <img src="images/1up-logo.png" class="ally-logo">
        <span class="ally-title">1 UNITED POWER</span>
        <div class="main-nav">
            <a href="index.html" class="nav-btn">DASHBOARD</a>
            <a href="history.html" class="nav-btn">LEAVERS HISTORY</a>
            <a href="pvpzone.html" class="nav-btn">PVP ZONE</a>
            <a href="schedule.html" class="nav-btn active">SPAWN TIMERS</a>
            <a href="halloffame.html" class="nav-btn">HALL OF FAME</a>
        </div>
    </div>

    <div class="page-wrap">
        <div class="tz-note">All times shown in your local timezone: <span id="tz-name">—</span></div>

        <div class="ui-container">
            <!-- LEFT PANEL -->
            <div class="left-panel">
                <h2>TIMERS <span>(Lineage 2)</span></h2>
                <img src="images/hourglass_timer.png" class="hourglass-img" alt="Chronos Hourglass">
                <div class="main-timer" id="main-timer">00:00:00</div>
                <div class="chronos-label" id="main-timer-label">Nearest Event</div>
            </div>

            <!-- RIGHT PANEL -->
            <div class="right-panel">
                <div class="ui-tabs">
                    <div class="ui-tab active" onclick="switchTab('all', this)">All Events</div>
                    <div class="ui-tab" onclick="switchTab('boss', this)">Bosses</div>
                    <div class="ui-tab" onclick="switchTab('siege', this)">Sieges</div>
                    <div class="ui-tab" onclick="switchTab('clanhall', this)">Clan Halls</div>
                </div>
                
                <div class="events-grid" id="events-grid">
                    <div class="loading-text">Loading spawn timers…</div>
                </div>
            </div>
        </div>

        <div class="updated-note" id="updated-note"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDRL8EehxdcgVYJ0LJ1khVYkSJcaCMKRes",
            authDomain: "brokenmirrordb.firebaseapp.com",
            databaseURL: "https://brokenmirrordb-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let regroupEvents = [];
        let updatedAt = null;
        let activeTab = 'all';

        // Reuse boss icons from history/market where possible
        const bossIcons = {
            "valakas": "images/necklace-valakas.png",
            "antharas": "images/earring-antharas.png",
            "baium": "images/ring-of-baium.png",
            "frintezza": "images/frintezza-necklace.png",
            "zaken": "images/zaken-earring.png",
            "queen ant": "images/ring-of-queen-ant.png",
            "ant queen": "images/ring-of-queen-ant.png",
            "orfen": "images/earring-orfen.png",
            "core": "images/ring-of-core.png"
        };

        function getIconForEvent(name, category) {
            const n = name.toLowerCase();
            for (const [key, icon] of Object.entries(bossIcons)) {
                if (n.includes(key)) return icon;
            }
            if (category === 'siege') return "images/images.png"; // Standard siege icon placeholder
            if (category === 'clanhall') return "images/clan-picture.png"; // Placeholder
            return "images/attedance-points.png"; // Generic fallback
        }

        document.getElementById('tz-name').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || 'local';

        function categorize(name) {
            const n = name.toLowerCase();
            if (n.startsWith('ch -') || n.startsWith('ch-') || n.includes('clan hall')) return 'clanhall';
            if (n.startsWith('siege')) return 'siege';
            return 'boss';
        }

        function fmtRemaining(ms, detailed = false) {
            if (ms <= 0) return null;
            let s = Math.floor(ms / 1000);
            const d = Math.floor(s / 86400); s %= 86400;
            const h = Math.floor(s / 3600); s %= 3600;
            const m = Math.floor(s / 60); s %= 60;
            
            if (detailed) { // Format: 02D 18H 33M (like image)
                if (d > 0) return `${String(d).padStart(2,'0')}D ${String(h).padStart(2,'0')}H ${String(m).padStart(2,'0')}M`;
                if (h > 0) return `${String(h).padStart(2,'0')}H ${String(m).padStart(2,'0')}M ${String(s).padStart(2,'0')}S`;
                return `${String(m).padStart(2,'0')}M ${String(s).padStart(2,'0')}S`;
            } else { // Format: 00:15:28
                if (d > 0) return `${d}d ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
        }

        function localDateString(ms) {
            return new Date(ms).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
        }

        db.ref('regroups').on('value', (snap) => {
            const data = snap.val() || {};
            updatedAt = data.updatedAt || null;
            const events = data.events || {};
            regroupEvents = Object.values(events)
                .filter(e => e && e.respawnTimestamp)
                .map(e => {
                    const cat = categorize(e.event);
                    return {
                        event: e.event,
                        ts: e.respawnTimestamp * 1000,
                        category: cat,
                        icon: getIconForEvent(e.event, cat)
                    };
                })
                .sort((a, b) => a.ts - b.ts);
            render();
        });

        window.switchTab = function(tab, element) {
            activeTab = tab;
            document.querySelectorAll('.ui-tab').forEach(t => t.classList.remove('active'));
            if (element) {
                element.classList.add('active');
            } else {
                document.querySelector('.ui-tab').classList.add('active'); // fallback
            }
            render();
        };

        function render() {
            if (!regroupEvents.length) {
                document.getElementById('events-grid').innerHTML = '<div class="loading-text">No spawn timers available.</div>';
                return;
            }

            // Filter for right panel
            const filtered = activeTab === 'all' ? regroupEvents : regroupEvents.filter(e => e.category === activeTab);
            
            if (!filtered.length) {
                document.getElementById('events-grid').innerHTML = '<div class="loading-text">No upcoming events in this category.</div>';
            } else {
                let html = '';
                html = filtered.map(e => `
                    <div class="event-token">
                        <div class="icon-frame"><img src="${e.icon}" alt="icon"></div>
                        <div class="event-timer" data-ts="${e.ts}">--:--</div>
                        <div class="event-name">${e.event}</div>
                        <div class="event-date">${localDateString(e.ts)}</div>
                    </div>
                `).join('');
                document.getElementById('events-grid').innerHTML = html;
            }

            document.getElementById('updated-note').textContent = updatedAt
                ? 'Schedule last synced: ' + new Date(updatedAt).toLocaleString() : '';
            
            tick(); // Immediate update
        }

        function tick() {
            if (!regroupEvents.length) return;
            const now = Date.now();

            // Update main left panel timer (closest future event)
            const futureEvents = regroupEvents.filter(e => e.ts > now);
            const mainTimerEl = document.getElementById('main-timer');
            const mainLabelEl = document.getElementById('main-timer-label');
            
            if (futureEvents.length > 0) {
                const nearest = futureEvents[0];
                mainTimerEl.textContent = fmtRemaining(nearest.ts - now, false);
                mainTimerEl.classList.remove('spawned');
                mainLabelEl.textContent = nearest.event;
            } else {
                mainTimerEl.textContent = "00:00:00";
                mainTimerEl.classList.add('spawned');
                mainLabelEl.textContent = "All Events Spawned";
            }

            // Update grid tokens
            document.querySelectorAll('.event-timer').forEach(el => {
                const ts = +el.dataset.ts;
                const remaining = fmtRemaining(ts - now, true); // Use detailed 00D 00H 00M style
                if (remaining === null) {
                    el.textContent = 'Spawned';
                    if (!el.classList.contains('spawned')) el.classList.add('spawned');
                } else {
                    el.textContent = remaining;
                    el.classList.remove('spawned');
                }
            });
        }

        setInterval(tick, 1000);
    </script>
</body>
</html>
