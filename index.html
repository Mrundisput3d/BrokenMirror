<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMA | Alliance Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #0a0c0f; }

        body { 
            background: var(--bg); 
            background-image: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url('https://i.ibb.co/FbHYLMCD/BACKGROUND.png'); 
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: #eee; 
            font-family: 'Open Sans', sans-serif; 
            margin: 0; padding: 0;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        header { text-align: center; margin-bottom: 50px; }
        h1 { font-family: 'Cinzel'; color: var(--gold); font-size: 3.5rem; letter-spacing: 10px; margin: 0; text-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }
        .tagline { font-family: 'Cinzel'; color: #888; letter-spacing: 3px; font-size: 1rem; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            align-items: start;
        }

        .card {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid #333;
            border-top: 3px solid var(--gold);
            min-height: 300px;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            background: rgba(212, 175, 55, 0.1);
            padding: 15px 20px;
            font-family: 'Cinzel';
            color: var(--gold);
            font-size: 1.1rem;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ΤΟ ΚΟΥΜΠΙ ΠΟΥ ΘΕΛΟΥΜΕ */
        .market-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        .enter-btn {
            display: inline-block;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 30px;
            font-family: 'Cinzel';
            text-decoration: none;
            letter-spacing: 2px;
            transition: 0.3s;
            margin-top: 20px;
        }

        .enter-btn:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 15px var(--gold);
        }

        /* EVENT LIST STYLE */
        .event-list { list-style: none; padding: 20px; margin: 0; }
        .event-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; border-bottom: 1px solid #222;
        }
        .event-name { font-family: 'Cinzel'; color: #fff; }
        .event-time { color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>BMA</h1>
            <div class="tagline">Blood Money Alliance Portal</div>
        </header>

        <div class="dashboard-grid">
            
            <div class="card">
                <div class="card-header">
                    <img src="https://i.ibb.co/SXM1FZx8/attedance-points.png" style="width:25px; height:25px;"> 
                    MARKET & POLICIES
                </div>
                <div class="market-content">
                    <p style="color: #888; font-size: 0.9rem; margin: 0;">Access Jewel Market, Attendance Rules<br>and Clan Agreements.</p>
                    <a href="market.html" class="enter-btn">ENTER MARKETPLACE</a>
                </div>
            </div>

            <div class="card">
                <div class="card-header">UPCOMING EVENTS</div>
                <ul class="event-list">
                    <li class="event-item"><span class="event-name">Baium</span> <span class="event-time">22:00</span></li>
                    <li class="event-item"><span class="event-name">Queen Ant</span> <span class="event-time">19:30</span></li>
                    <li class="event-item"><span class="event-name">Alliance Meeting</span> <span class="event-time">Sunday 21:00</span></li>
                </ul>
            </div>

        </div>
    </div>

</body>
</html>
