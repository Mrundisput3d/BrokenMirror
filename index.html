<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broken Mirror Alliance | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --gold: #d4af37; --silver: #c0c0c0; --bronze: #cd7f32;
            --noldor-sky: #00d9ff; --krim-red: #ff3333;
            --noldor-grad: linear-gradient(90deg, rgba(0,217,255,0.15) 0%, rgba(0,0,0,0) 100%);
            --krim-grad: linear-gradient(90deg, rgba(255,51,51,0.15) 0%, rgba(0,0,0,0) 100%);
            --bg: #0a0c0f;
        }
        
        body { 
            background: var(--bg); 
            background-image: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url('https://i.ibb.co/FbHYLMCD/BACKGROUND.png'); 
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: #eee; 
            font-family: 'Open Sans', sans-serif; 
            margin: 0; padding: 0;
        }

        .header-controls { position: absolute; top: 20px; right: 40px; display: flex; gap: 10px; z-index: 100; }
        .control-btn { color: var(--gold); font-family: 'Cinzel'; border: 1px solid var(--gold); padding: 5px 15px; border-radius: 5px; background: rgba(0,0,0,0.6); font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .top-header { text-align: center; padding-top: 20px; }
        .ally-logo { width: 110px; filter: drop-shadow(0 0 15px var(--gold)); }
        .ally-title { font-family: 'Cinzel Decorative', cursive; font-size: 1.8rem; color: var(--gold); display: block; letter-spacing: 2px; margin-bottom: 20px;}
        .main-nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-btn { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); color: var(--gold); padding: 8px 15px; font-family: 'Cinzel'; cursor: pointer; font-size: 0.75rem; border-radius: 4px; text-decoration: none; }
        .nav-btn.active { background: var(--gold); color: #000; }
        .leaders-row { display: flex; justify-content: center; gap: 40px; margin-bottom: 20px; }
        .leader-card { text-align: center; cursor: pointer; width: 110px; }
        .img-frame { width: 80px; height: 80px; margin: 0 auto; background: #000; border: 2px solid var(--gold); border-radius: 50%; overflow: hidden; }
        .leader-img { width: 100%; height: 100%; object-fit: contain; }
        .leader-name { color: var(--gold); font-size: 0.8rem; font-family: 'Cinzel'; display: block; margin-top: 8px; font-weight: bold; }
        .leader-role { color: #888; font-size: 0.6rem; text-transform: uppercase; display: block; }
        
        .market-action-row { text-align: center; margin: 30px 0; }
        .enter-market-btn { display: inline-block; background: rgba(212, 175, 55, 0.1); border: 2px solid var(--gold); color: var(--gold); padding: 15px 40px; font-family: 'Cinzel'; font-size: 1.1rem; text-decoration: none; font-weight: bold; letter-spacing: 2px; border-radius: 5px; transition: 0.3s; cursor: pointer; }
        .enter-market-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }
        
        .section-title { text-align: center; color: var(--gold); font-family: 'Cinzel'; font-size: 1.3rem; margin: 20px 0 10px 0; border-bottom: 1px solid rgba(212, 175, 55, 0.3); padding-bottom: 10px; display: inline-block; }
        .section-title-wrapper { text-align: center; margin-bottom: 20px; }

        .page { display: block; max-width: 1500px; margin: 0 auto; padding: 0 20px; }
        .main-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
        .clan-column { background: rgba(15, 18, 22, 0.95); height: 750px; display: flex; flex-direction: column; border: 1px solid #333; border-radius: 10px; border-top: 4px solid var(--gold); }
        .column-header { padding: 15px; text-align: center; font-family: 'Cinzel'; font-size: 1.1rem; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .scroll-area { overflow-y: auto; padding: 10px; flex-grow: 1; }
        .cp-box { margin-bottom: 8px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.05); }
        .cp-noldor { border-left: 4px solid var(--noldor-sky); background: var(--noldor-grad); }
        .cp-krim { border-left: 4px solid var(--krim-red); background: var(--krim-grad); }
        .cp-btn { width: 100%; background: none; border: none; padding: 12px 15px; color: #fff; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 0.85rem; }
        .cp-content { display: none; background: rgba(0,0,0,0.85); padding: 15px; border-top: 1px solid #333; }
        .cp-box.active .cp-content { display: block; }
        
        .roster-section { background: rgba(255,255,255,0.03); border: 1px solid #333; padding: 10px; border-radius: 5px; margin-bottom: 10px; font-size: 0.75rem; line-height: 1.6; }
        .leader-item { color: var(--gold); font-weight: bold; font-size: 0.8rem; }
        
        .member-click { color: #aaa; cursor: pointer; transition: 0.2s; border-bottom: 1px dashed transparent; }
        .member-click:hover { color: var(--gold); border-bottom: 1px dashed var(--gold); text-shadow: 0 0 5px rgba(212,175,55,0.5); }
        
        .loot-btn { width: 100%; background: rgba(212,175,55,0.1); border: 1px solid #444; color: var(--gold); padding: 8px; font-family: 'Cinzel'; font-size: 0.65rem; cursor: pointer; border-radius: 4px; margin-bottom: 10px; }
        
        .loot-panel { 
            display: none; 
            padding: 12px; 
            background: rgba(0,0,0,0.5); 
            margin-bottom: 10px; 
            border-radius: 4px; 
            font-size: 0.75rem; 
            border: 1px solid #222; 
            color: #aaa; 
            max-height: 200px; 
            overflow-y: auto;  
        }
        .loot-panel::-webkit-scrollbar { width: 6px; }
        .loot-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        .loot-panel::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .stat-box { background: #15181c; padding: 6px; border: 1px solid #333; text-align: center; border-radius: 4px; }
        .boss-icon { width: 22px; height: 22px; margin-bottom: 4px; }
        .stat-val { font-size: 0.75rem; color: #fff; font-family: 'Cinzel'; display: block; }
        
        .other-clans-section { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        
        .new-clan-card { background: rgba(15, 18, 22, 0.95); border: 1px solid #333; border-top: 3px solid var(--gold); border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .new-clan-card:hover { transform: translateY(-3px); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        
        .new-clan-icon { width: 55px; height: 55px; margin-bottom: 12px; }
        .new-clan-name { display: block; font-family: 'Cinzel'; color: #fff; font-size: 0.95rem; }
        
        /* MODALS */
        #caller-modal, #cp-stats-modal, #member-stats-modal, #clan-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 420px; background: #0f1216; border: 2px solid var(--gold); border-radius: 15px; padding: 25px; z-index: 9999; text-align: center; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9998; backdrop-filter: blur(5px); }
    </style>
</head>

<body onclick="tryAutoPlay()">

    <div class="header-controls">
        <div class="control-btn" onclick="toggleMusic(event)"><span id="music-icon">🔇</span> <span id="track-name">DION THEME</span></div>
        <div class="control-btn" onclick="nextTrack(event)">⏭ NEXT</div>
        <div class="control-btn" id="clock">SERVER TIME: 00:00:00 UTC</div>

    <audio id="bg-music" loop><source id="music-source" src="https://www.dropbox.com/scl/fi/ypzqrr336iewt62gncy6u/Lineage-2-Dion-Theme-Song.mp3?rlkey=nl1quliuqleuljgkt5jhqq6hh&st=sb8ij16g&raw=1" type="audio/mpeg"></audio>

    <div class="modal-overlay" id="overlay" onclick="closeModal()"></div>
    
    <div id="caller-modal">
        <img id="modal-img" src="" style="width:90px; height:90px; border-radius:50%; border:2px solid var(--gold); background:#000; margin-bottom:15px;">
        <h2 id="modal-name" style="font-family:'Cinzel'; color:var(--gold); margin:0;"></h2>
        <p id="modal-title" style="color:#888; font-size:0.7rem; margin-bottom:20px;"></p>
        
        <button class="loot-btn" onclick="toggleLeaderLoot()">VIEW LOOT HISTORY</button>
        <div id="leader-loot-panel" class="loot-panel" style="display:none; text-align:left;">No history found.</div>
        
        <button class="loot-btn" id="caller-attendance-btn" style="display:none;">VIEW ATTENDANCES</button>

        <button onclick="closeModal()" style="margin-top:20px; background:var(--gold); color:#000; border:none; padding:10px 25px; cursor:pointer; font-weight:bold; border-radius:4px; width: 100%;">CLOSE</button>
    </div>

    <div id="cp-stats-modal">
        <h2 id="cp-stats-name" style="font-family:'Cinzel'; color:var(--gold); margin:0 0 20px 0; font-size:1.3rem;"></h2>
        <div class="stat-grid" id="cp-stats-grid"></div>
        <button onclick="closeModal()" style="margin-top:20px; background:var(--gold); color:#000; border:none; padding:10px 25px; cursor:pointer; font-weight:bold; border-radius:4px; width: 100%;">CLOSE</button>
    </div>

    <div id="member-stats-modal">
        <h2 id="member-stats-name" style="font-family:'Cinzel'; color:var(--gold); margin:0 0 5px 0; font-size:1.3rem;"></h2>
        <p style="color:#888; font-size:0.7rem; margin-bottom:20px;">PERSONAL ATTENDANCES</p>
        <div class="stat-grid" id="member-stats-grid"></div>
        <button onclick="closeModal()" style="margin-top:20px; background:var(--gold); color:#000; border:none; padding:10px 25px; cursor:pointer; font-weight:bold; border-radius:4px; width: 100%;">CLOSE</button>
    </div>

    <div id="clan-modal">
        <img id="clan-modal-img" src="" style="width:90px; height:90px; border-radius:10px; border:2px solid var(--gold); background:rgba(0,0,0,0.6); margin-bottom:15px; object-fit:contain; padding:5px;">
        <h2 id="clan-modal-name" style="font-family:'Cinzel'; color:var(--gold); margin:0 0 15px 0; font-size:1.3rem;"></h2>
        <div id="clan-modal-content"></div>
        <button onclick="closeModal()" style="margin-top:10px; background:var(--gold); color:#000; border:none; padding:10px 25px; cursor:pointer; font-weight:bold; border-radius:4px; width: 100%;">CLOSE</button>
    </div>

    <div class="top-header">
        <img src="https://i.ibb.co/6R9q5PGv/ALLIANCE-LOGO.png" class="ally-logo">

        <div class="main-nav">
            <button class="nav-btn active">DASHBOARD</button>

    <div id="dashboard" class="page">

            <a href="market.html" class="enter-market-btn">⚖️ ENTER MARKETPLACE & POLICIES ⚖️</a>
        </div>

        <div class="section-title-wrapper">
            <span class="section-title">ALLIANCE CP LIST</span>
        </div>

        <div class="main-wrapper">
            <div class="clan-column">
                <div class="column-header" style="color:var(--noldor-sky)"><img src="https://i.ibb.co/8LvFNQkC/noldor.png" style="width:25px;"> NOLDOR CLAN</div>
                <div class="scroll-area" id="noldor-list"></div>
            </div>
            <div class="clan-column">
                <div class="column-header" style="color:var(--krim-red)"><img src="https://i.ibb.co/VYMZjzYr/kriminalides.png" style="width:25px;"> KRIMINALIDES CLAN</div>
                <div class="scroll-area" id="krim-list"></div>
            </div>
        </div>
        
        <div class="other-clans-section">
            <div class="new-clan-card" onclick="openClanModal('OrzelBialy', 'OrzelBialy Clan', 'https://i.ibb.co/6cgvyHHW/orzelbialy.png')">
                <img src="https://i.ibb.co/6cgvyHHW/orzelbialy.png" class="new-clan-icon">
                <span class="new-clan-name">OrzelBialy Clan</span>
            </div>
            <div class="new-clan-card" onclick="openClanModal('ExitGaming', 'ExitGaming Clan', 'https://i.ibb.co/Y4spJqVy/exitgaming.png')">
                <img src="https://i.ibb.co/Y4spJqVy/exitgaming.png" class="new-clan-icon">
                <span class="new-clan-name">ExitGaming Clan</span>
            </div>
            <div class="new-clan-card" onclick="openClanModal('LastKingdom', 'LastKingdom Clan', 'https://i.ibb.co/xqg1qNFw/lastkingdom.png')">
                <img src="https://i.ibb.co/xqg1qNFw/lastkingdom.png" class="new-clan-icon">
                <span class="new-clan-name">LastKingdom Clan</span>
            </div>
        </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDRL8EehxdcgVYJ0LJ1khVYkSJcaCMKRes", authDomain: "brokenmirrordb.firebaseapp.com", databaseURL: "https://brokenmirrordb-default-rtdb.europe-west1.firebasedatabase.app", projectId: "brokenmirrordb" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const bossIcons = { "VAL": "https://i.ibb.co/84gZPVRP/necklace-valakas.png", "ANT": "https://i.ibb.co/rfqvc6mv/earring-antharas.png", "BAI": "https://i.ibb.co/XrZkv67h/ring-of-baium.png", "FRI": "https://i.ibb.co/gF4YKGTM/frintezza-necklace.png", "ZAK": "https://i.ibb.co/spkC6Gzz/zaken-earring.png", "AQ":  "https://i.ibb.co/rKRtZmBG/ring-of-queen-ant.png", "ORF": "https://i.ibb.co/j9dDnXwH/earring-orfen.png", "COR": "https://i.ibb.co/ksv37fNZ/ring-of-.png", "SIE": "https://i.ibb.co/Txfby6wD/images.png" };

        let globalCPData = {}; 
        let globalExternalClans = {}; 

        db.ref('externalClans/').on('value', (snapshot) => {
            globalExternalClans = snapshot.val() || {};
        });

        function getIconForLoot(itemName) {
            if(!itemName) return "https://i.ibb.co/SXM1FZx8/attedance-points.png";
            const upName = itemName.toUpperCase();
            if(upName.includes("VAL")) return bossIcons.VAL;
            
            // ΔΙΟΡΘΩΣΗ: Ξεχωρίζουμε Antharas από Queen Ant
            if(upName.includes("QUEEN") || upName.includes("AQ")) return bossIcons.AQ;
            if(upName.includes("ANT")) return bossIcons.ANT; 
            
            if(upName.includes("BAI")) return bossIcons.BAI;
            if(upName.includes("FRI")) return bossIcons.FRI;
            if(upName.includes("ZAK")) return bossIcons.ZAK;
            if(upName.includes("ORF")) return bossIcons.ORF;
            if(upName.includes("COR")) return bossIcons.COR;
            return "https://i.ibb.co/SXM1FZx8/attedance-points.png"; 
        }

        db.ref('cps/').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            globalCPData = data; 
            const nList = document.getElementById('noldor-list');
            const kList = document.getElementById('krim-list');
            nList.innerHTML = ""; kList.innerHTML = "";
            let dynamicLeadersHtml = ""; 

            const sortedIDs = Object.keys(data).sort((a,b) => (data[b].totalPoints || 0) - (data[a].totalPoints || 0));
            
            sortedIDs.forEach(id => {
                const cp = data[id];
                if(cp.clan === 'history') return;

                if(cp.clan === 'caller') {
                    const role = cp.leader || "CALLER";
                    const img = cp.imgUrl || "https://i.ibb.co/SXM1FZx8/attedance-points.png";
                    dynamicLeadersHtml += `
                        <div class="leader-card" onclick="openCaller('${id}', '${role}', '${img}')">
                            <div class="img-frame"><img src="${img}" class="leader-img"></div>
                            <span class="leader-name">${cp.name.toUpperCase()}</span>
                            <span class="leader-role">${role}</span>
                        </div>`;
                    return; 
                }

                const style = cp.clan === 'noldor' ? 'cp-noldor' : 'cp-krim';
                
                let lootHtml = "No history found.";
                if(cp.lootHistory && cp.lootHistory.length > 0) {
                    lootHtml = cp.lootHistory.map(l => `
                        <div style="display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                            <img src="${getIconForLoot(l.item)}" style="width:18px; height:18px; object-fit:contain;">
                            <span style="color:#888; font-size:0.7rem;">${l.date}</span>
                            <span style="color:#ddd; flex-grow:1; text-align:left;">${l.item}</span>
                            <span style="color:#ff4444; font-family:'Cinzel'; font-weight:bold;">-${l.cost}</span>
                        </div>
                    `).join('');
                }

                let membersHtml = 'Roster pending...';
                if (cp.members) {
                    membersHtml = cp.members.split(',').map(m => {
                        let mName = m.trim();
                        if(!mName) return '';
                        return `<span class="member-click" onclick="openMemberStats('${mName}')">${mName}</span>`;
                    }).join(', ');
                }

                let leaderHtml = 'Pending...';
                if (cp.leader) {
                    let lName = cp.leader.trim();
                    leaderHtml = `<span class="member-click" onclick="openMemberStats('${lName}')">${lName}</span>`;
                }
                
                const html = `
                    <div class="cp-box ${style}">
                        <button class="cp-btn" onclick="this.parentElement.classList.toggle('active')">
                            <span>${cp.name}</span><span style="color:var(--gold); font-size:0.75rem;">${cp.totalPoints || 0} PTS</span>
                        </button>
                        <div class="cp-content">
                            <div class="roster-section">
                                <span class="leader-item">👑 ${leaderHtml}</span><br>
                                <span style="color:#888;">Members: ${membersHtml}</span>
                            </div>

                            <button class="loot-btn" onclick="const p=this.nextElementSibling; p.style.display=p.style.display==='block'?'none':'block';">VIEW LOOT HISTORY</button>
                            <div class="loot-panel" style="display:none; text-align:left;">${lootHtml}</div>

                            <button class="loot-btn" onclick="openCpStats('${id}')">VIEW CP ATTENDANCES</button>
                        </div>
                    </div>`;
                if(cp.clan === 'noldor') nList.innerHTML += html;
                else kList.innerHTML += html;
            });

            document.getElementById('dynamic-leaders').innerHTML = dynamicLeadersHtml;
        });

        function openCpStats(cpId) {
            const cp = globalCPData[cpId];
            if(!cp) return;
            document.getElementById('caller-modal').style.display = 'none';
            document.getElementById('cp-stats-name').innerText = cp.name.toUpperCase() + " ATTENDANCES";
            document.getElementById('cp-stats-grid').innerHTML = Object.keys(bossIcons).map(b => {
                const val = (cp.bossStats && cp.bossStats[b]) ? cp.bossStats[b] : 0;
                return `<div class="stat-box"><img src="${bossIcons[b]}" class="boss-icon"><span class="stat-val">${val}</span></div>`;
            }).join('');
            document.getElementById('cp-stats-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function openMemberStats(memberName) {
            document.getElementById('member-stats-name').innerText = memberName.toUpperCase() + " (LOADING...)";
            document.getElementById('member-stats-grid').innerHTML = "<div style='grid-column:1/-1; color:var(--gold); padding:20px; font-family:Cinzel;'>Scanning logs...</div>";
            document.getElementById('member-stats-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';

            db.ref('dailyLogs/').once('value', snapshot => {
                let mStats = { VAL:0, ANT:0, BAI:0, FRI:0, ZAK:0, AQ:0, ORF:0, COR:0, SIE:0 };
                const dailyLogs = snapshot.val() || {};
                const searchName = memberName.trim().toUpperCase();

                Object.values(dailyLogs).forEach(dayData => {
                    Object.keys(dayData).forEach(pName => {
                        if (pName.trim().toUpperCase() === searchName) {
                            const playerBosses = dayData[pName];
                            Object.keys(playerBosses).forEach(bossId => {
                                const b = bossId.toUpperCase();
                                if(b.includes('VAL')) mStats.VAL++;
                                else if(b.includes('ANT')) mStats.ANT++;
                                else if(b.includes('BAI')) mStats.BAI++;
                                else if(b.includes('FRI')) mStats.FRI++;
                                else if(b.includes('ZAK')) mStats.ZAK++;
                                else if(b.includes('AQ') || b.includes('QUEEN')) mStats.AQ++;
                                else if(b.includes('ORF')) mStats.ORF++;
                                else if(b.includes('COR')) mStats.COR++;
                                else if(b.includes('SIE')) mStats.SIE++;
                            });
                        }
                    });
                });

                document.getElementById('member-stats-name').innerText = memberName.toUpperCase();
                document.getElementById('member-stats-grid').innerHTML = Object.keys(bossIcons).map(b => {
                    return `<div class="stat-box"><img src="${bossIcons[b]}" class="boss-icon"><span class="stat-val">${mStats[b]}</span></div>`;
                }).join('');
            });
        }

        function openCaller(callerId, role, img) {
            const cp = globalCPData[callerId];
            if(!cp) return;
            document.getElementById('modal-name').innerText = cp.name.toUpperCase() + ` (${cp.totalPoints || 0} PTS)`;
            document.getElementById('modal-title').innerText = role.toUpperCase();
            document.getElementById('modal-img').src = img;
            let lootHtml = "No history found.";
            if(cp.lootHistory && cp.lootHistory.length > 0) {
                lootHtml = cp.lootHistory.map(l => `
                    <div style="display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                        <img src="${getIconForLoot(l.item)}" style="width:18px; height:18px; object-fit:contain;">
                        <span style="color:#888; font-size:0.7rem;">${l.date}</span>
                        <span style="color:#ddd; flex-grow:1; text-align:left;">${l.item}</span>
                        <span style="color:#ff4444; font-family:'Cinzel'; font-weight:bold;">-${l.cost}</span>
                    </div>
                `).join('');
            }
            document.getElementById('leader-loot-panel').innerHTML = lootHtml;
            const attBtn = document.getElementById('caller-attendance-btn');
            if (role.toUpperCase() === 'ALLY LEADER') attBtn.style.display = 'none';
            else { attBtn.style.display = 'block'; attBtn.onclick = function() { openCpStats(callerId); }; }
            document.getElementById('caller-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function openClanModal(clanId, clanName, iconUrl) {
            document.getElementById('clan-modal-name').innerText = clanName.toUpperCase();
            document.getElementById('clan-modal-img').src = iconUrl;
            const extData = globalExternalClans[clanId] || {};
            const leaderName = extData.leader || "Pending...";
            const lootHistory = extData.lootHistory || [];
            let content = "Alliance agreements pending.";
            if (clanId === "ExitGaming") content = "<b style='color:var(--gold)'>NIGHT EPICS:</b><br>assigned to ExitGaming.<br><br><b style='color:var(--gold)'>HIGH EPICS:</b><br>1 Exit, 3 Alliance.";
            else if (clanId === "LastKingdom") content = "<b style='color:var(--gold)'>EPIC DISTRIBUTION:</b><br>Based on attendance.<br><br><b style='color:var(--gold)'>BAIUM ACCESS:</b><br>Every 5th or 6th.";
            let lootHtml = "No history found.";
            if(lootHistory.length > 0) {
                lootHtml = lootHistory.map(l => `
                    <div style="display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                        <img src="${getIconForLoot(l.item)}" style="width:18px; height:18px; object-fit:contain;">
                        <span style="color:#888; font-size:0.7rem;">${l.date}</span>
                        <span style="color:#ddd; flex-grow:1; text-align:left;">${l.item}</span>
                        <span style="color:#ff4444; font-family:'Cinzel'; font-weight:bold;">-${l.cost}</span>
                    </div>`).join('');
            }
            const finalHtml = `
                <div style="margin-bottom: 15px; font-size:0.95rem;"><span style="color:var(--gold); font-weight:bold; font-family:'Cinzel';">👑 LEADER:</span> <span style="color:#fff;">${leaderName}</span></div>
                <div style="color:#ddd; font-size:0.85rem; line-height:1.6; text-align:justify; margin-bottom:20px; padding: 10px; background:rgba(0,0,0,0.3); border:1px solid #333; border-radius:5px;">${content}</div>
                <button class="loot-btn" onclick="const p=this.nextElementSibling; p.style.display=p.style.display==='block'?'none':'block';">VIEW LOOT HISTORY</button>
                <div class="loot-panel" style="display:none; text-align:left;">${lootHtml}</div>`;
            document.getElementById('clan-modal-content').innerHTML = finalHtml;
            document.getElementById('clan-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function closeModal() { 
            document.getElementById('caller-modal').style.display='none'; 
            document.getElementById('cp-stats-modal').style.display='none'; 
            document.getElementById('member-stats-modal').style.display='none'; 
            document.getElementById('clan-modal').style.display='none'; 
            document.getElementById('overlay').style.display='none'; 
        }
        function toggleLeaderLoot() { const p = document.getElementById('leader-loot-panel'); p.style.display = p.style.display==='none'?'block':'none'; }

        const tracks = [
            {name:"DION THEME", url:"https://www.dropbox.com/scl/fi/ypzqrr336iewt62gncy6u/Lineage-2-Dion-Theme-Song.mp3?rlkey=nl1quliuqleuljgkt5jhqq6hh&st=sb8ij16g&raw=1"},
            {name:"HUNTERS THEME", url:"https://www.dropbox.com/scl/fi/75hck498enzot93zt0lg9/Lineage-2-Hunters-Village-Theme.mp3?rlkey=6mu9ic0gavmofkdvduj72270y&st=qr4cvisl&raw=1"},
            {name:"GIRAN THEME", url:"https://www.dropbox.com/scl/fi/iu8j9wn9wky8fav176ayf/Lineage-2-Giran-Theme.mp3?rlkey=xp1j0upa076sy21tgcta6t9c3&st=0a4ihyhg&raw=1"}
        ];
        let currentIdx = 0; const audio = document.getElementById('bg-music'); const musicIcon = document.getElementById('music-icon'); let userMuted = false;
        function toggleMusic(e) { if(e) e.stopPropagation(); if (audio.paused) { audio.play(); musicIcon.innerText="🔊"; userMuted = false; } else { audio.pause(); musicIcon.innerText="🔇"; userMuted = true; } }
        function nextTrack(e) { if(e) e.stopPropagation(); currentIdx = (currentIdx + 1) % tracks.length; audio.src = tracks[currentIdx].url; document.getElementById('track-name').innerText = tracks[currentIdx].name; audio.play(); musicIcon.innerText="🔊"; userMuted = false; }
        function tryAutoPlay() { if(audio.paused && !userMuted) { audio.play().then(() => { musicIcon.innerText = "🔊"; }).catch(() => {}); } }
        setInterval(() => { document.getElementById('clock').innerText = "SERVER TIME: " + new Date().toLocaleTimeString('el-GR', {timeZone:'UTC', hour12:false}) + " UTC"; }, 1000);
    </script>
</body>
</html>
