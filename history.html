<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>1UP | Hall of Records</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --gold: #d4af37; --bg: #0a0c0f; --card: rgba(21, 24, 28, 0.9); }
        
        body { 
            background: var(--bg); 
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('images/background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #eee; 
            font-family: 'Open Sans', sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        
        /* NAVIGATION BAR (Ολόιδιο με index.html) */
        .top-header { text-align: center; padding-top: 20px; background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(212, 175, 55, 0.3); padding-bottom: 15px;}
        .ally-logo { width: 110px; filter: drop-shadow(0 0 15px var(--gold)); }
        .ally-title { font-family: 'Cinzel Decorative', cursive; font-size: 1.8rem; color: var(--gold); display: block; letter-spacing: 2px; margin-bottom: 20px;}
        .main-nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .nav-btn { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); color: var(--gold); padding: 8px 15px; font-family: 'Cinzel'; cursor: pointer; font-size: 0.75rem; border-radius: 4px; text-decoration: none; transition: 0.3s;}
        .nav-btn:hover { background: rgba(212, 175, 55, 0.3); }
        .nav-btn.active { background: var(--gold); color: #000; }

        .header-section { padding: 40px 20px 20px; text-align: center; }
        h1 { font-family: 'Cinzel'; color: var(--gold); font-size: 2.8rem; margin: 0; text-shadow: 0 0 20px rgba(0,0,0,1); }
        .subtitle { color: #aaa; font-family: 'Cinzel'; margin-top: 10px; letter-spacing: 2px; font-size: 0.9rem; font-weight: bold; text-transform: uppercase;}
        
        .history-container { max-width: 1100px; margin: 20px auto 40px; padding: 0 20px; display: grid; grid-template-columns: 1fr; gap: 20px; }
        
        .history-card { 
            background: var(--card); 
            border: 1px solid #333; 
            border-left: 5px solid #555; 
            padding: 25px; 
            border-radius: 12px;
            display: grid; 
            grid-template-columns: 2fr 3fr; 
            align-items: center; 
            gap: 20px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        .history-card:hover { border-left-color: var(--gold); transform: scale(1.01); box-shadow: 0 0 20px rgba(0,0,0,0.8);}
        
        .cp-info { border-right: 1px solid #444; padding-right: 20px; }
        .cp-name { font-family: 'Cinzel'; font-size: 1.6rem; color: var(--gold); margin: 0; text-transform: uppercase;}
        .cp-pts-badge { display: inline-block; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 20px; color: var(--gold); font-weight: bold; margin-top: 10px; border: 1px solid #555; }
        
        .loot-section { display: flex; flex-wrap: wrap; gap: 10px; }
        .loot-tag { 
            background: rgba(0,0,0,0.5); border: 1px solid #444; padding: 6px 12px; border-radius: 6px; 
            font-size: 0.8rem; display: flex; align-items: center; gap: 8px;
        }
        .loot-tag img { width: 22px; height: 22px; border-radius: 3px; object-fit: contain;}
        
        .no-records { text-align: center; padding: 100px; color: #888; font-family: 'Cinzel'; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="top-header">
        <img src="images/1up-logo.png" class="ally-logo">
        <span class="ally-title">1 UNITED POWER ALLIANCE</span>
        <div class="main-nav">
            <a href="index.html" class="nav-btn">DASHBOARD</a>
            <a href="history.html" class="nav-btn active">LEAVERS HISTORY</a>
            <a href="pvpzone.html" class="nav-btn">PVP ZONE</a>
            <a href="schedule.html" class="nav-btn">SPAWN TIMERS</a>
            <a href="halloffame.html" class="nav-btn">HALL OF FAME</a>
        </div>
    </div>

    <div class="header-section">
        <h1>HALL OF RECORDS</h1>
        <div class="subtitle">Eternal Legacy of the Fallen</div>
    </div>

    <div class="history-container" id="history-list">
        <div style="text-align: center; color: var(--gold); font-family: 'Cinzel'; padding: 50px;">Consulting the archives...</div>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDRL8EehxdcgVYJ0LJ1khVYkSJcaCMKRes", 
            databaseURL: "https://brokenmirrordb-default-rtdb.europe-west1.firebasedatabase.app" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const bossIcons = { "VAL": "images/necklace-valakas.png", "ANT": "images/earring-antharas.png", "BAI": "images/ring-of-baium.png", "FRI": "images/frintezza-necklace.png", "ZAK": "images/zaken-earring.png", "AQ":  "images/ring-of-queen-ant.png", "ORF": "images/earring-orfen.png", "COR": "images/ring-of-core.png", "SIE": "images/images.png" };

        function getIconForLoot(itemName) {
            if(!itemName) return "images/attedance-points.png";
            const upName = itemName.toUpperCase();
            if(upName.includes("VAL")) return bossIcons.VAL;
            if(upName.includes("QUEEN") || upName.includes("AQ")) return bossIcons.AQ;
            if(upName.includes("ANT")) return bossIcons.ANT; 
            if(upName.includes("BAI")) return bossIcons.BAI;
            if(upName.includes("FRI")) return bossIcons.FRI;
            if(upName.includes("ZAK")) return bossIcons.ZAK;
            if(upName.includes("ORF")) return bossIcons.ORF;
            if(upName.includes("COR")) return bossIcons.COR;
            return "images/attedance-points.png"; 
        }

        let globalCPs = {};
        let globalExtClans = {};

        // Φορτώνουμε και τους δύο φακέλους για να βρούμε ΟΛΟΥΣ όσους είναι στο History
        db.ref('cps/').on('value', snap => {
            globalCPs = snap.val() || {};
            renderHistory();
        });

        db.ref('externalClans/').on('value', snap => {
            globalExtClans = snap.val() || {};
            renderHistory();
        });

        function renderHistory() {
            const container = document.getElementById('history-list');
            let historyList = [];

            // Ψάχνουμε τα CPs & Callers
            Object.keys(globalCPs).forEach(id => {
                if (globalCPs[id].clan === 'history') {
                    historyList.push({ id, type: 'cp', ...globalCPs[id] });
                }
            });

            // Ψάχνουμε τις External Clans (Συμμαχίες)
            Object.keys(globalExtClans).forEach(id => {
                if (globalExtClans[id].status === 'history') {
                    historyList.push({ id, type: 'external', ...globalExtClans[id] });
                }
            });

            if (historyList.length === 0) {
                container.innerHTML = "<div class='no-records'>THE ARCHIVES ARE CURRENTLY EMPTY</div>";
                return;
            }

            // Ταξινομούμε βάσει πόντων
            historyList.sort((a, b) => (b.totalPoints || 0) - (a.totalPoints || 0));

            let htmlString = "";

            historyList.forEach(item => {
                let lootHtml = "";
                if (item.lootHistory && item.lootHistory.length > 0) {
                    lootHtml = item.lootHistory.map(l => {
                        const icon = getIconForLoot(l.item);
                        return `<div class="loot-tag"><img src="${icon}"> <span>${l.item}</span></div>`;
                    }).join('');
                } else {
                    lootHtml = "<span style='color:#666; font-style:italic;'>No legacy loot recorded.</span>";
                }

                // Αν είναι External Clan, βγάζουμε badge "BROKEN ALLIANCE" αντί για πόντους.
                const ptsBadge = item.type === 'external' && !item.totalPoints 
                    ? `<div class="cp-pts-badge" style="color:#aaa; border-color:#444;">BROKEN ALLIANCE</div>`
                    : `<div class="cp-pts-badge">${item.totalPoints || 0} PTS</div>`;

                htmlString += `
                    <div class="history-card">
                        <div class="cp-info">
                            <h2 class="cp-name">${item.name || item.id}</h2>
                            <div style="font-size:0.85rem; color:#aaa; margin-top:5px;">Leader: ${item.leader || 'Unknown'}</div>
                            ${ptsBadge}
                        </div>
                        <div class="loot-section">${lootHtml}</div>
                    </div>
                `;
            });

            container.innerHTML = htmlString;
        }
    </script>
</body>
</html>
