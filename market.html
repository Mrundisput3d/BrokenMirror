<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMA | Market & Policies</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #0a0c0f; }

        body { 
            background: var(--bg); 
            background-image: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), url('https://i.ibb.co/FbHYLMCD/BACKGROUND.png'); 
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: #eee; 
            font-family: 'Open Sans', sans-serif; 
            margin: 0; padding: 0;
        }

        /* MUSIC BOX - EXACT INDEX STYLE */
        .audio-player {
            position: fixed; top: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.9); border: 1px solid var(--gold);
            padding: 12px; z-index: 1000; border-radius: 4px;
        }
        .audio-player label { color: var(--gold); font-family: 'Cinzel'; font-size: 0.7rem; display: block; margin-bottom: 5px; }
        .audio-player select {
            background: #000; color: var(--gold); border: 1px solid var(--gold);
            padding: 5px; font-family: 'Cinzel'; cursor: pointer;
        }

        .top-nav { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .nav-btn {
            background: rgba(0,0,0,0.8); border: 2px solid var(--gold); color: var(--gold);
            padding: 10px 25px; font-family: 'Cinzel'; text-decoration: none; font-weight: bold;
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 120px 20px; }
        
        h1 { 
            font-family: 'Cinzel'; color: var(--gold); text-align: center; 
            font-size: 3.5rem; letter-spacing: 8px; text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        /* MARKET SECTION */
        .market-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 50px 0 80px; }
        .jewel-card {
            background: rgba(10, 10, 10, 0.9); border: 1px solid #333;
            padding: 15px; display: flex; align-items: center; gap: 15px;
            border-bottom: 3px solid var(--gold);
        }
        .jewel-icon { width: 45px; height: 45px; border: 1px solid var(--gold); }

        /* POLICIES BOX */
        .policies-box {
            background: rgba(5, 5, 5, 0.95); border: 2px solid var(--gold);
            padding: 60px; line-height: 1.8; box-shadow: 0 0 50px rgba(0,0,0,1);
        }
        
        .section-header {
            font-family: 'Cinzel'; color: var(--gold); font-size: 1.7rem;
            margin-top: 40px; margin-bottom: 20px; border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            display: flex; align-items: center; gap: 15px; padding-bottom: 10px;
        }

        /* Custom Icons Style */
        .policy-icon { width: 40px; height: 40px; object-fit: contain; }

        .policy-text { white-space: pre-line; font-size: 1.1rem; color: #ccc; }
        .highlight { color: var(--gold); font-weight: bold; display: block; margin-top: 10px; }
        .important { color: #ff4444; font-weight: bold; }

        .clan-agreement {
            background: rgba(212, 175, 55, 0.05); border: 1px solid #444;
            padding: 25px; margin-top: 30px; display: flex; align-items: center; gap: 20px;
            border-left: 5px solid var(--gold);
        }
        .clan-logo { width: 80px; height: 80px; border: 1px solid var(--gold); background: #000; }
    </style>
</head>
<body>

    <div class="audio-player">
        <label>Ambient Audio</label>
        <select id="audioSelect">
            <option value="none">Silence</option>
            <option value="S2C_P7-Yn8o">Dion Theme</option>
            <option value="pSj7S8N6Ksc">Giran Theme</option>
            <option value="vO6WpS8p4n0">Hunters Village</option>
        </select>
    </div>
    <div id="player"></div>

    <div class="top-nav">
        <a href="index.html" class="nav-btn">← DASHBOARD</a>
    </div>

    <div class="container">
        <h1>MARKET & POLICIES</h1>

        <div class="market-grid">
            <div class="jewel-card"><img src="https://i.ibb.co/84gZPVRP/necklace-valakas.png" class="jewel-icon"><div><span style="font-family:'Cinzel';font-size:0.8rem;">Valakas</span><br><span style="color:var(--gold);font-weight:bold;">3100</span></div></div>
