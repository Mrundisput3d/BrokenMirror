<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>BMA | Intelligence Center V19.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --gold: #d4af37; --bg: #0a0c0f; --card: #15181c; --blue: #3498db; --red: #ff4444; --green: #28a745; }
        body { background: var(--bg); color: #eee; font-family: 'Open Sans', sans-serif; padding: 20px; font-size: 13px; }
        h1, h2 { font-family: 'Cinzel'; color: var(--gold); text-align: center; margin-bottom: 20px; }
        
        .header-container { display: flex; justify-content: space-between; align-items: center; max-width: 1500px; margin: 0 auto 20px; }
        .logout-btn { background: none; border: 1px solid var(--red); color: var(--red); padding: 5px 15px; cursor: pointer; font-family: 'Cinzel'; border-radius: 4px; font-size: 10px; transition: 0.3s; }
        .logout-btn:hover { background: var(--red); color: white; }
        
        .main-grid { display: grid; grid-template-columns: 1fr 380px; gap: 20px; max-width: 1500px; margin: 0 auto; }
        .panel { background: var(--card); border-radius: 10px; padding: 15px; border: 1px solid #333; border-top: 3px solid var(--gold); margin-bottom: 20px; }
        
        .stats-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #000; padding: 10px; border-radius: 5px; text-align: center; border: 1px solid #444; }
        .stat-card b { font-size: 1.2rem; color: var(--gold); }

        /* Scrollable Table Container */
        .table-container { max-height: 500px; overflow-y: auto; margin-top: 10px; border: 1px solid #333; border-radius: 5px; }
        .log-table { width: 100%; border-collapse: collapse; }
        .log-table th { background: #111; padding: 10px; text-align: left; color: #888; font-size: 0.7rem; border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 10; }
        .log-table td { padding: 8px; border-bottom: 1px solid #222; }
        .player-tag { color: var(--gold); font-weight: bold; }
        .boss-tag { background: #1a2a3a; color: var(--blue); padding: 2px 6px; border-radius: 3px; font-size: 0.7rem; font-weight: bold; }

        input { padding: 8px; background: #000; color: #fff; border: 1px solid #444; border-radius: 4px; width: 100%; box-sizing: border-box; }
        .btn { padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-red { background: #600; color: white; width: 100%; margin-top: 20px; }
        
        .rank-row { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #222; font-size: 0.85rem; }
        .rank-row:nth-child(even) { background: rgba(255,255,255,0.02); }
        .low-epic-header { color: var(--green); border-color: var(--green); }
    </style>
</head>
<body>

    <div class="header-container">
        <div style="width:80px"></div> <h1 style="margin:0;">BMA INTELLIGENCE CENTER V19.1</h1>
        <button class="logout-btn" onclick="logout()">LOGOUT</button>
    </div>

    <div class="main-grid">
        <div>
            <div class="stats-summary" id="boss-analytics"></div>

            <div class="panel">
                <div style="display: flex; gap: 10px; align-items: flex-end;">
                    <div style="flex: 1;">
                        <label style="color:#aaa; font-size:11px;">Ημερομηνία:</label>
                        <input type="date" id="date-filter" onchange="renderLogs()" style="font-family:'Cinzel'; cursor:pointer; height: 35px;">
                    </div>
                    <div style="flex: 2;">
                        <label style="color:#aaa; font-size:11px;">Ιστορικό Παίκτη (Αναζήτηση):</label>
                        <input type="text" id="player-filter" placeholder="Πληκτρολόγησε όνομα..." list="players-list" oninput="renderLogs()" style="height: 35px;">
                    </div>
                    <button class="btn btn-blue" onclick="exportToCSV()" style="height: 35px; margin-bottom: 0;">EXPORT CSV</button>
                </div>

                <div class="table-container">
                    <table class="log-table">
                        <thead>
                            <tr id="log-table-head">
                                <th>TIME</th>
                                <th>PLAYER</th>
                                <th>BOSS</th>
                                <th>CP OWNER</th>
                            </tr>
                        </thead>
                        <tbody id="logs-list"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="right-column">
            <div class="panel">
                <h2 style="font-size: 1.1rem;">WEEKLY CP RANKING (ALL)</h2>
                <p style="text-align:center; color:#666; font-size:0.75rem; margin-top:-15px;">Συνολική δραστηριότητα 7 ημερών</p>
                <div id="ranking-list"></div>
            </div>

            <div class="panel" style="border-top-color: var(--green);">
                <h2 style="font-size: 1.1rem; color: var(--green);">WEEKLY LOW EPICS RANKING</h2>
                <p style="text-align:center; color:#666; font-size:0.75rem; margin-top:-15px;">Zaken, Orfen, Core, AQ, Frintezza</p>
                <div id="low-epics-ranking-list"></div>
            </div>

            <div class="panel">
                <h2 style="font-size: 1.1rem;">BOSS PARTICIPATION</h2>
                <div id="boss-ranking-list"></div>
            </div>
        </div>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDRL8EehxdcgVYJ0LJ1khVYkSJcaCMKRes", databaseURL: "https://brokenmirrordb-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- Ο ΦΥΛΑΚΑΣ (AUTH CHECK) - ΠΡΟΣΤΕΘΗΚΕ! ---
    firebase.auth().onAuthStateChanged((user) => {
        if (!user) {
            window.location.href = "login.html";
        }
    });

    function logout() {
        firebase.auth().signOut().then(() => {
            window.location.href = "login.html";
        });
    }
    // ------------------------------

    const d = new Date();
    const todayISO = new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
    document.getElementById('date-filter').value = todayISO;

    let allLogs = {};
    const lowEpicsKeys = ['ZAK', 'ORF', 'COR', 'AQ', 'FRI'];

    db.ref('dailyLogs/').on('value', snap => {
        allLogs = snap.val() || {};
        populatePlayerDatalist();
        renderLogs();
        calculateIntelligence();
    });

    function populatePlayerDatalist() {
        let players = new Set();
        Object.values(allLogs).forEach(day => {
            Object.keys(day).forEach(pName => players.add(pName));
        });
        let dl = document.getElementById('players-list');
        if (!dl) {
            dl = document.createElement('datalist');
            dl.id = 'players-list';
            document.body.appendChild(dl);
        }
        dl.innerHTML = Array.from(players).sort().map(p => `<option value="${p.toUpperCase()}">`).join('');
    }

    function getSelectedDateStr() {
        const rawDate = document.getElementById('date-filter').value;
        if (!rawDate) return "";
        const parts = rawDate.split('-');
        if (parts.length === 3) {
            return `${parseInt(parts[2], 10)}-${parseInt(parts[1], 10)}-${parts[0]}`;
        }
        return rawDate;
    }

    function renderLogs() {
        const selectedDate = getSelectedDateStr();
        const playerSearch = document.getElementById('player-filter').value.trim().toLowerCase();
        const container = document.getElementById('logs-list');
        const thead = document.getElementById('log-table-head');
        
        let htmlString = "";
        
        if (playerSearch) {
            if(thead) thead.innerHTML = `<th>DATE</th><th>TIME</th><th>BOSS</th><th>CP OWNER</th>`;
            const dates = Object.keys(allLogs).sort((a, b) => {
                let [da, ma, ya] = a.split('-'); let [db, mb, yb] = b.split('-');
                return new Date(yb, mb-1, da) - new Date(ya, ma-1, db);
            }).reverse();

            dates.forEach(dateKey => {
                const dayData = allLogs[dateKey];
                if (!dayData) return;

                const pNameKey = Object.keys(dayData).find(k => k.toLowerCase() === playerSearch);
                if (pNameKey && dayData[pNameKey]) {
                    Object.keys(dayData[pNameKey]).forEach(bossId => {
                        const ev = dayData[pNameKey][bossId];
                        htmlString += `<tr>
                            <td style="color:var(--gold); font-weight:bold;">${dateKey}</td>
                            <td style="color:#888; font-size:0.75rem;">${ev.time || '-'}</td>
                            <td><span class="boss-tag">${bossId}</span></td>
                            <td style="color:#28a745">${(ev.cp || 'N/A').toUpperCase()}</td>
                        </tr>`;
                    });
                }
            });
            if (!htmlString) htmlString = `<tr><td colspan="4" style="text-align:center; padding:20px; color:#aaa;">Δεν βρέθηκαν συμμετοχές για τον παίκτη.</td></tr>`;
            
        } else {
            if(thead) thead.innerHTML = `<th>TIME</th><th>PLAYER</th><th>BOSS</th><th>CP OWNER</th>`;
            const datesToSearch = selectedDate ? [selectedDate] : [];
            
            datesToSearch.forEach(dateKey => {
                const dayData = allLogs[dateKey];
                if (!dayData) return;

                let allEvents = [];
                Object.keys(dayData).forEach(pName => {
                    Object.keys(dayData[pName]).forEach(bossId => {
                        allEvents.push({ pName, bossId, ev: dayData[pName][bossId] });
                    });
                });
                allEvents.sort((a, b) => (b.ev.timestamp || 0) - (a.ev.timestamp || 0));

                allEvents.forEach(item => {
                    htmlString += `<tr>
                        <td style="color:#666; font-size:0.7rem;">${item.ev.time || ''}</td>
                        <td class="player-tag">${item.pName.toUpperCase()}</td>
                        <td><span class="boss-tag">${item.bossId}</span></td>
                        <td style="color:#28a745">${(item.ev.cp || 'N/A').toUpperCase()}</td>
                    </tr>`;
                });
            });
            if (!htmlString) htmlString = `<tr><td colspan="4" style="text-align:center; padding:20px; color:#aaa;">Δεν βρέθηκαν συμμετοχές για ${selectedDate}.</td></tr>`;
        }

        container.innerHTML = htmlString;
    }

    function calculateIntelligence() {
        let cpStats = {};
        let lowEpicStats = {};
        let bossStats = {};
        const now = new Date();
        
        for (let i = 0; i < 7; i++) {
            let d = new Date(); d.setDate(now.getDate() - i);
            let dateKey = `${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}`;
            
            if (allLogs[dateKey]) {
                Object.values(allLogs[dateKey]).forEach(playerEntry => {
                    Object.keys(playerEntry).forEach(bossId => {
                        const cpName = playerEntry[bossId].cp;
                        if (!cpName) return;
                        
                        const cpNameUpper = cpName.toUpperCase(); // Ομορφιά στο Ranking

                        // 1. Γενικό Ranking
                        cpStats[cpNameUpper] = (cpStats[cpNameUpper] || 0) + 1;
                        
                        // 2. Low Epics Ranking
                        if (lowEpicsKeys.includes(bossId)) {
                            lowEpicStats[cpNameUpper] = (lowEpicStats[cpNameUpper] || 0) + 1;
                        }

                        // 3. Boss Analytics
                        bossStats[bossId] = (bossStats[bossId] || 0) + 1;
                    });
                });
            }
        }

        // Render General Ranking
        document.getElementById('ranking-list').innerHTML = Object.entries(cpStats)
            .sort((a,b) => b[1] - a[1])
            .map(([name, score]) => `<div class="rank-row"><span>${name}</span><b style="color:var(--gold)">${score}</b></div>`).join('') || "<p style='text-align:center; color:#555;'>No logs in the last 7 days.</p>";

        // Render Low Epics Ranking
        document.getElementById('low-epics-ranking-list').innerHTML = Object.entries(lowEpicStats)
            .sort((a,b) => b[1] - a[1])
            .map(([name, score]) => `<div class="rank-row"><span>${name}</span><b style="color:var(--green)">${score}</b></div>`).join('') || "<p style='text-align:center; color:#555;'>No Low Epic logs.</p>";

        // Render Boss Cards & List
        const sortedBosses = Object.entries(bossStats).sort((a,b) => b[1] - a[1]);
        const top3 = sortedBosses.slice(0, 3);
        
        document.getElementById('boss-analytics').innerHTML = top3.map(([id, count]) => `
            <div class="stat-card"><small>TOP EVENT: ${id}</small><br><b>${count}</b> <small>ppl</small></div>`).join('');

        document.getElementById('boss-ranking-list').innerHTML = sortedBosses
            .map(([id, count]) => `<div class="rank-row"><span>${id}</span><span style="color:var(--blue)">${count}</span></div>`).join('');
    }

    function exportToCSV() {
        const selectedDate = getSelectedDateStr();
        const playerSearch = document.getElementById('player-filter').value.trim().toLowerCase();
        
        let csv = "Date,Time,Player,Boss,CP\n";
        let hasData = false;

        const datesToSearch = playerSearch ? Object.keys(allLogs).sort().reverse() : [selectedDate];

        datesToSearch.forEach(dateKey => {
            const dayData = allLogs[dateKey];
            if (!dayData) return;

            Object.keys(dayData).forEach(pName => {
                if (playerSearch && !pName.toLowerCase().includes(playerSearch)) return;
                
                Object.keys(dayData[pName]).forEach(bossId => {
                    const ev = dayData[pName][bossId];
                    csv += `${dateKey},${ev.time || ''},${pName},${bossId},${ev.cp || 'N/A'}\n`;
                    hasData = true;
                });
            });
        });

        if(!hasData) {
            alert("Δεν βρέθηκαν δεδομένα για εξαγωγή με τα τρέχοντα φίλτρα.");
            return;
        }

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; 
        a.download = `BMA_Logs_${playerSearch ? playerSearch : selectedDate}.csv`; 
        a.click();
        window.URL.revokeObjectURL(url);
    }
</script>
</body>
</html>
