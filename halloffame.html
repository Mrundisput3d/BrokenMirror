<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Broken Mirror Alliance | Hall of Fame</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --gold: #d4af37; --silver: #c0c0c0; --bronze: #cd7f32;
            --noldor-sky: #00d9ff; --krim-red: #ff3333;
            --bg: #0a0c0f;
        }
        
        body, html { 
            background: var(--bg); 
            /* ΠΙΟ ΦΩΤΕΙΝΗ ΣΚΙΑ: Το rgba(0,0,0,0.4) αφήνει το 60% της φωτογραφίας να φανεί! */
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://i.ibb.co/RGpww9dy/HALLOFFAME.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #eee; 
            font-family: 'Open Sans', sans-serif; 
            margin: 0; padding: 0;
            scroll-behavior: smooth;
        }

        /* Music Controls */
        .header-controls { position: absolute; top: 20px; right: 40px; display: flex; gap: 10px; z-index: 100; }
        .control-btn { color: var(--gold); font-family: 'Cinzel'; border: 1px solid var(--gold); padding: 5px 15px; border-radius: 5px; background: rgba(0,0,0,0.6); font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; backdrop-filter: blur(5px);}
        .control-btn:hover { background: var(--gold); color: #000; }
        .back-btn { text-decoration: none; color: #fff; border-color: #555; }

        /* --- HERO SECTION --- */
        .hero-section {
            position: relative;
            width: 100%;
            height: 50vh; /* Πιο κοντό από το index για να φαίνονται κατευθείαν τα Ranks */
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            border-bottom: 2px solid var(--gold);
        }

        .hero-content { position: relative; z-index: 10; padding: 0 20px; }
        .hero-subtitle { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.2rem; letter-spacing: 4px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(0,0,0,0.9); }
        .hero-title { font-family: 'Cinzel Decorative', cursive; font-size: 4rem; color: #fff; margin: 0; line-height: 1.1; text-shadow: 0 5px 15px rgba(0,0,0,0.9); }
        .hero-bottom-fade { position: absolute; bottom: 0; left: 0; width: 100%; height: 100px; background: linear-gradient(to top, rgba(10,12,15,0.9), transparent); z-index: 5; pointer-events: none; }

        /* --- MAIN CONTENT (RANKINGS) --- */
        .dashboard-container { max-width: 1400px; margin: 40px auto; padding: 0 20px 50px 20px; z-index: 5; position: relative; }
        
        .main-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        
        /* Glassmorphism Panels for Rankings */
        .rank-column { 
            background: rgba(10, 12, 15, 0.85); 
            height: auto; min-height: 600px; 
            display: flex; flex-direction: column; 
            border: 1px solid rgba(212,175,55,0.3); 
            border-radius: 10px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .column-header { 
            padding: 20px; text-align: center; 
            font-family: 'Cinzel'; font-size: 1.3rem; font-weight: bold;
            border-bottom: 1px solid rgba(212,175,55,0.3); 
            background: linear-gradient(90deg, transparent, rgba(212,175,55,0.1), transparent);
            color: var(--gold);
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        /* TABS FOR TOP 10 */
        .tabs-container { display: flex; border-bottom: 1px solid #333; background: rgba(0,0,0,0.4); }
        .tab-btn { 
            flex: 1; padding: 12px; background: none; border: none; 
            color: #888; font-family: 'Cinzel'; font-weight: bold; font-size: 0.9rem;
            cursor: pointer; transition: 0.3s; 
        }
        .tab-btn.active { color: var(--gold); background: rgba(212,175,55,0.1); border-bottom: 2px solid var(--gold); }
        .tab-btn:hover:not(.active) { color: #fff; }

        .scroll-area { overflow-y: auto; padding: 20px; flex-grow: 1; }

        /* List Items Styling */
        .rank-item { 
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            padding: 12px 20px; margin-bottom: 10px; border-radius: 8px;
            transition: 0.3s;
        }
        .rank-item:hover { background: rgba(212,175,55,0.1); border-color: rgba(212,175,55,0.3); transform: translateX(5px); }
        
        .rank-number { font-family: 'Cinzel Decorative'; font-size: 1.5rem; color: #555; font-weight: bold; width: 40px; }
        .rank-item:nth-child(1) .rank-number { color: var(--gold); text-shadow: 0 0 10px var(--gold); font-size: 1.8rem;} /* 1st place */
        .rank-item:nth-child(2) .rank-number { color: var(--silver); text-shadow: 0 0 10px var(--silver); } /* 2nd place */
        .rank-item:nth-child(3) .rank-number { color: var(--bronze); text-shadow: 0 0 10px var(--bronze); } /* 3rd place */
        
        .rank-name { font-weight: bold; font-size: 1.1rem; color: #fff; flex-grow: 1; margin-left: 10px; letter-spacing: 1px;}
        .rank-score { font-family: 'Cinzel'; color: var(--gold); font-weight: bold; font-size: 1.1rem; }
        .rank-subtitle { font-size: 0.7rem; color: #888; display: block; font-family: 'Open Sans'; letter-spacing: 0;}

        /* --- DEVELOPER FOOTER --- */
        .developer-footer {
            text-align: center; padding: 25px 20px; background: rgba(10, 12, 15, 0.95);
            border-top: 1px solid rgba(212,175,55,0.2); font-family: 'Cinzel', serif;
            color: #888; font-size: 0.85rem; letter-spacing: 1px; position: relative; z-index: 5; margin-top: 40px;
        }
        .dev-name { color: var(--gold); font-weight: bold; font-size: 1rem; }
        .dev-contact { margin-top: 8px; font-size: 0.8rem; font-family: 'Open Sans', sans-serif; color: #aaa; }
        .dev-discord { color: #fff; background: rgba(255,255,255,0.08); padding: 3px 10px; border-radius: 5px; margin-left: 5px; font-family: monospace; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.1); }

        /* Responsive */
        @media (max-width: 768px) {
            .header-controls { top: 10px; right: 10px; flex-direction: column; align-items: flex-end; gap: 5px;}
            .main-wrapper { grid-template-columns: 1fr; gap: 30px;}
            .hero-title { font-size: 2.5rem; }
            .dev-contact { display: block; line-height: 2; }
            .dev-discord { display: inline-block; margin-top: 5px; }
        }
    </style>
</head>

<body onclick="tryAutoPlay()">

    <div class="header-controls">
        <a href="index.html" class="control-btn back-btn">⬅ BACK TO HQ</a>
        <div class="control-btn" onclick="toggleMusic(event)"><span id="music-icon">🔇</span> <span id="track-name">ADEN THEME</span></div>
        <div class="control-btn" id="clock" style="cursor:default;">SERVER TIME: 00:00:00 UTC</div>
    </div>
    <!-- Επικό Aden Theme για το Hall of Fame -->
    <audio id="bg-music" loop><source src="https://www.dropbox.com/scl/fi/w1p73wftpxs722rgyxyk4/Lineage-2-Aden-Theme.mp3?rlkey=5bq52v0z240qj5u9q89f4w4t3&st=z88u8h7a&raw=1" type="audio/mpeg"></audio>

    <header class="hero-section">
        <div class="hero-content">
            <div class="hero-subtitle">The Immortals</div>
            <h1 class="hero-title">HALL OF FAME</h1>
        </div>
        <div class="hero-bottom-fade"></div>
    </header>

    <div class="dashboard-container">
        <div class="main-wrapper">
            
            <!-- ΣΤΗΛΗ 1: ALLIANCE CP RANKINGS (Total Points) -->
            <div class="rank-column">
                <div class="column-header">ALLIANCE CP RANKINGS</div>
                <div class="scroll-area" id="cp-ranking-list">
                    <div style="text-align:center; color:#888; margin-top:20px;">Loading Data...</div>
                </div>
            </div>

            <!-- ΣΤΗΛΗ 2: TOP 10 ACTIVE PLAYERS (Με Tabs) -->
            <div class="rank-column">
                <div class="column-header">TOP 10 ACTIVE PLAYERS</div>
                <div class="tabs-container">
                    <button class="tab-btn active" id="btn-weekly" onclick="showTop10('weekly')">WEEKLY ACTIVE</button>
                    <button class="tab-btn" id="btn-alltime" onclick="showTop10('alltime')">ALL TIME (TOTAL)</button>
                </div>
                <div class="scroll-area" id="players-ranking-list">
                    <div style="text-align:center; color:#888; margin-top:20px;">Scanning Attendance Logs...</div>
                </div>
            </div>

        </div>
    </div>

    <!-- DEVELOPER FOOTER -->
    <footer class="developer-footer">
        <div>Designed & Developed by <span class="dev-name">MrUndisputed</span></div>
        <div class="dev-contact">Looking for a custom web project? Contact me on Discord: <span class="dev-discord">mrundisputedgiwrgos</span></div>
    </footer>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDRL8EehxdcgVYJ0LJ1khVYkSJcaCMKRes", authDomain: "brokenmirrordb.firebaseapp.com", databaseURL: "https://brokenmirrordb-default-rtdb.europe-west1.firebasedatabase.app", projectId: "brokenmirrordb" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let dailyLogsData = {};
        let cpData = {};
        let top10AllTime = [];
        let top10Weekly = [];

        // 1. Fetch CPs for Ranking
        db.ref('cps/').on('value', (snapshot) => {
            cpData = snapshot.val() || {};
            renderCpRankings();
        });

        // 2. Fetch Daily Logs for Top 10 Active Players
        db.ref('dailyLogs/').on('value', (snapshot) => {
            dailyLogsData = snapshot.val() || {};
            calculateTop10();
            showTop10('weekly'); // Default view
        });

        // Render CP Rankings
        function renderCpRankings() {
            const listDiv = document.getElementById('cp-ranking-list');
            listDiv.innerHTML = '';
            
            // Φιλτράρουμε Callers & History, κρατάμε μόνο CPs
            const validCPs = Object.values(cpData).filter(cp => cp.clan === 'noldor' || cp.clan === 'krim');
            validCPs.sort((a, b) => (b.totalPoints || 0) - (a.totalPoints || 0));

            if(validCPs.length === 0) {
                listDiv.innerHTML = '<div style="text-align:center; color:#888;">No CPs found.</div>';
                return;
            }

            validCPs.forEach((cp, index) => {
                const clanColor = cp.clan === 'noldor' ? 'var(--noldor-sky)' : 'var(--krim-red)';
                listDiv.innerHTML += `
                    <div class="rank-item" style="border-left: 3px solid ${clanColor}">
                        <div class="rank-number">${index + 1}</div>
                        <div class="rank-name">
                            ${cp.name.toUpperCase()}
                            <span class="rank-subtitle">Leader: ${cp.leader || 'Unknown'}</span>
                        </div>
                        <div class="rank-score">${cp.totalPoints || 0} PTS</div>
                    </div>
                `;
            });
        }

        // Υπολογισμός των Top 10 (All time & Weekly)
        function calculateTop10() {
            let allTimeScores = {};
            let weeklyScores = {};

            // Όλες οι ημερομηνίες ταξινομημένες (Υποθέτουμε format YYYY-MM-DD)
            const sortedDates = Object.keys(dailyLogsData).sort();
            const last7Dates = sortedDates.slice(-7); // Παίρνουμε τις 7 πιο πρόσφατες μέρες

            // Υπολογισμός All-Time
            sortedDates.forEach(date => {
                const dayData = dailyLogsData[date];
                Object.keys(dayData).forEach(playerName => {
                    const cleanName = playerName.trim();
                    if(!allTimeScores[cleanName]) allTimeScores[cleanName] = 0;
                    // Ο παίκτης παίρνει 1 πόντο (attendance) για κάθε boss που έκανε log εκείνη τη μέρα
                    allTimeScores[cleanName] += Object.keys(dayData[playerName]).length;
                });
            });

            // Υπολογισμός Weekly (Μόνο για τις τελευταίες 7 ημερομηνίες)
            last7Dates.forEach(date => {
                const dayData = dailyLogsData[date];
                Object.keys(dayData).forEach(playerName => {
                    const cleanName = playerName.trim();
                    if(!weeklyScores[cleanName]) weeklyScores[cleanName] = 0;
                    weeklyScores[cleanName] += Object.keys(dayData[playerName]).length;
                });
            });

            // Μετατροπή σε Arrays και Ταξινόμηση (Descending)
            top10AllTime = Object.entries(allTimeScores)
                .map(([name, score]) => ({ name, score }))
                .sort((a, b) => b.score - a.score)
                .slice(0, 10); // Κρατάμε το Top 10

            top10Weekly = Object.entries(weeklyScores)
                .map(([name, score]) => ({ name, score }))
                .sort((a, b) => b.score - a.score)
                .slice(0, 10);
        }

        // Εναλλαγή μεταξύ Weekly και All Time
        function showTop10(type) {
            // Κουμπιά UI
            document.getElementById('btn-weekly').classList.remove('active');
            document.getElementById('btn-alltime').classList.remove('active');
            
            const listDiv = document.getElementById('players-ranking-list');
            listDiv.innerHTML = '';

            let dataToShow = [];
            let subtitleText = "";

            if (type === 'weekly') {
                document.getElementById('btn-weekly').classList.add('active');
                dataToShow = top10Weekly;
                subtitleText = "Bosses Attended (Last 7 Days)";
            } else {
                document.getElementById('btn-alltime').classList.add('active');
                dataToShow = top10AllTime;
                subtitleText = "Total Bosses Attended (All Time)";
            }

            if(dataToShow.length === 0) {
                listDiv.innerHTML = '<div style="text-align:center; color:#888; margin-top:20px;">No logs found yet.</div>';
                return;
            }

            dataToShow.forEach((player, index) => {
                listDiv.innerHTML += `
                    <div class="rank-item">
                        <div class="rank-number">${index + 1}</div>
                        <div class="rank-name">
                            ${player.name}
                            <span class="rank-subtitle">${subtitleText}</span>
                        </div>
                        <div class="rank-score">${player.score}</div>
                    </div>
                `;
            });
        }

        // --- MUSIC PLAYER & CLOCK ---
        const audio = document.getElementById('bg-music'); 
        const musicIcon = document.getElementById('music-icon'); 
        let userMuted = false;
        function toggleMusic(e) { 
            if(e) e.stopPropagation(); 
            if (audio.paused) { audio.play(); musicIcon.innerText="🔊"; userMuted = false; } 
            else { audio.pause(); musicIcon.innerText="🔇"; userMuted = true; } 
        }
        function tryAutoPlay() { if(audio.paused && !userMuted) { audio.play().then(() => { musicIcon.innerText = "🔊"; }).catch(() => {}); } }
        setInterval(() => { document.getElementById('clock').innerText = "SERVER TIME: " + new Date().toLocaleTimeString('el-GR', {timeZone:'UTC', hour12:false}) + " UTC"; }, 1000);
    </script>
</body>
</html>
